{% set name = "pygeostat" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 0ef3f98412556498029e50a974088e915cd401a724772b68f369218c984461ff
  patches:
    - patches/0001-Fix-GSB-variable-name-encoding-decoding-for-NumPy-2.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # pygeostat bundles Windows binaries under pygeostat/fortran/resource/rm;
  # libintl3.dll links against libiconv2.dll from that same bundled folder.
  missing_dso_whitelist:
    - "**/libiconv2.dll"  # [win]
  skip: True  # [py<310]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools >=61
  run:
    - python
    - h5py >=3.13.0
    - matplotlib >=3.10.0
    - numba >=0.61.0
    - numpy >=2.1.3
    # pygeostat 1.2.0 still uses Series integer indexing (s[0]) in HDF5 I/O;
    # pandas 3 treats integer keys as labels and breaks this path.
    # This issue was found in 'test_write_read_h5' test without '<3' constraint.
    - pandas >=2.2.3,<3
    - pillow >=11.1.0
    - mpl-probscale >=0.2.5
    - pyperclip >=1.9.0
    - scikit-learn >=1.6.1
    - scipy >=1.15.2
    - statsmodels >=0.14.4
    - tqdm >=4.67.1

test:
  imports:
    - pygeostat
    - pygeostat.data
    - pygeostat.datautils
    - pygeostat.fortran
    - pygeostat.multivariate
    - pygeostat.plotting
    - pygeostat.programs
    - pygeostat.statistics
    - pygeostat.transformations
    - pygeostat.utility
  source_files:
    - tests/
  requires:
    - pip
    - pytest >=8.3.4
  commands:
    - pip check
    # Skipping test_write_vtk that requires pyevtk >=1.6.0 - not available in the main channel.
    - pytest -v tests/ -k "not test_write_vtk"

about:
  home: https://www.ccgalberta.com/pygeostat/welcome.html
  summary: Python interface for geostatistics
  description: |
    This is a Python package for geostatistical modeling. Pygeostat is aimed at preparing spatial data,
    scripting geostatistical workflows, modeling using tools developed at the Centre for Computational
    Geostatistics (CCG), and constructing visualizations to study spatial data, and geostatistical models.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/CcgAlberta/pygeostat
  doc_url: https://www.ccgalberta.com/pygeostat/index.html
